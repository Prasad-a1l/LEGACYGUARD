services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: legacyguard
      POSTGRES_PASSWORD: legacyguard
      POSTGRES_DB: legacyguard
    ports:
      - "5432:5432"
    volumes:
      - lg_pg:/var/lib/postgresql/data

  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - lg_qdrant:/qdrant/storage

volumes:
  lg_pg:
  lg_qdrant:
